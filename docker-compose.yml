# Pipewright 自托管 —— docker compose 一键起。
#
#   1. cp .env.example .env  并按注释填好(至少生成 PIPEWRIGHT_MASTER_KEY)
#   2. docker compose up -d
#   3. 打开 http://localhost:8080,用 admin / 你设的口令登录
#
# 数据(sqlite 库 / 构建产物 / 仓库缓存)持久化在具名卷 pipewright-data(挂到容器 /data,
# 镜像已将 /data 设为 nonroot 属主与工作目录)。master key 务必持久保存:换 key 旧凭据无法解密。
#
# 镜像有两档(见 .env 的 PIPEWRIGHT_IMAGE / PIPEWRIGHT_VERSION):
#   <版本>          distroless:最小攻击面、无 shell、无容器 CLI —— 容器内**不能**打包镜像。
#   <版本>-docker   alpine + docker CLI —— 挂上宿主 docker.sock 后容器内能真构建/推镜像。
# 默认走阿里云 ACR(青岛,两档都有,由 .github/workflows/aliyun-image.yml 发布);
# ghcr 只有 distroless 档(.goreleaser.yaml 发的),要换过去设 PIPEWRIGHT_IMAGE=ghcr.io/fuuhoo/pipewright。
services:
  pipewright:
    image: ${PIPEWRIGHT_IMAGE:-registry.cn-qingdao.aliyuncs.com/fubin/pipewright}:${PIPEWRIGHT_VERSION:-latest}
    container_name: pipewright
    restart: unless-stopped
    ports:
      - "${PIPEWRIGHT_PORT:-8080}:8080"
    environment:
      # 初始管理员口令(首启建账;之后改这里不改库)。务必改掉。
      PIPEWRIGHT_ADMIN_PASSWORD: ${PIPEWRIGHT_ADMIN_PASSWORD:?请在 .env 设置 PIPEWRIGHT_ADMIN_PASSWORD}
      # 凭据保险库主密钥(base64 的 32 字节)。空则保险库进未配置态、加密凭据功能不可用。
      PIPEWRIGHT_MASTER_KEY: ${PIPEWRIGHT_MASTER_KEY:-}
      # 反代后部署时填外部访问 URL(用于 webhook 回调 / OAuth 回跳)。
      PIPEWRIGHT_PUBLIC_URL: ${PIPEWRIGHT_PUBLIC_URL:-}
      # 默认 sqlite,库落 /data/pipewright.db(WORKDIR=/data)。切 MySQL 见下方 env + 注释。
      PIPEWRIGHT_DB_DRIVER: ${PIPEWRIGHT_DB_DRIVER:-sqlite}
      PIPEWRIGHT_DB_DSN: ${PIPEWRIGHT_DB_DSN:-}
      # 运行执行器:默认 DAG(真按 UI 可视化流水线 stages 执行)。仅需回退旧版固定流程时
      # 显式设 PIPEWRIGHT_RUNNER=legacy(clone→对仓库根 docker build→deploy,不跑可视化流水线)。
      PIPEWRIGHT_RUNNER: ${PIPEWRIGHT_RUNNER:-}
      # 构建工作区落点(配合下方 volumes 的 ②③)。留空 = 容器默认 /tmp,此时容器内隔离构建不可用。
      TMPDIR: ${PIPEWRIGHT_WORK_DIR:-}
    volumes:
      - pipewright-data:/data
      # ---- 想让平台在容器里打包镜像?三行一起放开(缺一不可)----
      # 前提:用 <版本>-docker 档镜像(默认 distroless 档里没有 docker CLI,放开下面三行也没用)。
      #
      # ① 宿主 Docker socket:平台的构建器是在进程内 exec 容器 CLI(internal/build/driver.go),
      #    有了 socket 它就通过 CLI 指挥**宿主** daemon 构建/推送,产出的镜像也就是宿主镜像。
      #    注意:挂 socket 等同授予容器宿主 root 级权限,只在信任的自托管机器上开。
      # - /var/run/docker.sock:/var/run/docker.sock
      #
      # ② 工作区目录必须在宿主与容器里**同名同路径**。原因:script 节点跑「隔离构建」用的是
      #    docker run -v <工作区>:<挂载点>,而 daemon 是宿主的 —— 它按**宿主路径**解析 -v 的源。
      #    路径不一致时 daemon 会在宿主凭空建一个空目录,构建拿到空工作区(症状:日志里全是
      #    "no such file or directory",而平台侧看着一切正常)。
      # ③ 把 TMPDIR 指到那个目录:构建工作区由 os.MkdirTemp 创建,落点跟 TMPDIR 走。
      #    把 PIPEWRIGHT_WORK_DIR 同时写进 .env 与下面两行(值必须一致,且是宿主绝对路径)。
      # - ${PIPEWRIGHT_WORK_DIR:?仅容器内构建才需要}:${PIPEWRIGHT_WORK_DIR:?仅容器内构建才需要}
    # 容器内的 localhost 是容器自己,不是宿主。要在 UI 里看**宿主机**的镜像列表 / 部署容器
    # (那两条路走 SSH 而非 socket),就把宿主登记成主机 host.docker.internal 的服务器。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 静态镜像无 curl/wget;用二进制自身做 TCP 探活的最小手段:复用 --version(进程可执行即健康)。
      test: ["CMD", "/pipewright", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 可选:MySQL 8。启用方式:
  #   docker compose --profile mysql up -d
  # 并在 .env 设 PIPEWRIGHT_DB_DRIVER=mysql、
  #   PIPEWRIGHT_DB_DSN=pipewright:pipewright@tcp(mysql:3306)/pipewright?parseTime=true&charset=utf8mb4
  mysql:
    image: mysql:8.0
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pipewright
      MYSQL_USER: pipewright
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pipewright}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
    volumes:
      - pipewright-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pipewright-data:
  pipewright-mysql:
